name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics and debug logs
      description: >-
        Download the diagnostics from the integration's menu and attach them.
        They hide the meter number and the RTE credentials; check before posting.
